<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1120">
<meta name="version" content="V1.01-261019-MarketIndicators">
<meta name="release-date" content="261019">
<title>시장 지표 (V1.01 - 261019)</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A1120; --panel:#0F182A; --panel-2:#0B1322; --border:#1C2842;
    --text:#E6ECF5; --text-dim:#8E9AB0; --text-faint:#5F6B82;
    --glow:#5EEAD4; --amber:#F5A524; --violet:#A78BFA;
    --f-body:'Noto Sans KR',system-ui,-apple-system,sans-serif;
    --f-mono:'JetBrains Mono',ui-monospace,monospace;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);}
  body{padding-block:calc(18px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-bottom));padding-inline:16px;}
  .wrap{max-width:520px;margin:0 auto;}
  h1{margin:0 0 4px;font-size:22px;font-weight:900;letter-spacing:-0.3px;}
  .ver{font-size:12px;color:var(--text-faint);font-family:var(--f-mono);}

  .mk-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:0 0 12px;text-decoration:none;color:inherit;}
  .mk-w{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:8px 6px;text-align:center;min-width:0;}
  .mk-w,.mk-w>span{display:block;}
  .mk-w .l{font-size:10.5px;color:var(--text-faint);font-weight:700;white-space:nowrap;}
  .mk-w .v{font-size:14px;font-weight:900;margin-top:2px;white-space:nowrap;letter-spacing:-0.3px;font-family:'JetBrains Mono',monospace;}
  .mk-w .s{font-size:10px;color:var(--text-dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mk{margin:18px 0 12px;} .mk-h{font-size:15px;font-weight:900;margin:0 0 4px;} .mk-u{font-size:11.5px;color:var(--text-faint);margin:0 0 10px;}
  .mk-c{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px 12px 10px;margin:0 0 10px;}
  .mk-c h3{margin:0 0 2px;font-size:13.5px;} .mk-c .big{font-size:22px;font-weight:900;font-family:'JetBrains Mono',monospace;} .mk-c .sub{font-size:11.5px;color:var(--text-dim);line-height:1.6;}
  .mk-c svg{width:100%;height:auto;display:block;margin-top:6px;}
  .mk-f{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px;} .mk-f input{width:100%;min-width:0;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);font-size:13px;}
  .mk-b{display:inline-block;margin-top:8px;padding:7px 12px;border-radius:9px;border:1px solid var(--border);background:none;color:var(--text);font-size:12.5px;font-weight:700;text-decoration:none;cursor:pointer;}

  .hub-pill{display:inline-flex;align-items:center;gap:3px;vertical-align:middle;margin-left:8px;padding:4px 10px;border-radius:99px;border:1px solid #2F4A7A;background:none;color:#8C98AD;font-size:12px;font-weight:700;line-height:1.3;white-space:nowrap;text-decoration:none;}
  .mk{margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>📈 시장 지표 <a class="hub-pill" href="./" aria-label="허브로 가기">🏠 허브</a></h1>
  <div class="ver">V1.01 (261019) · 공포·탐욕 · 원/달러 · 미국 CPI · 10년물 · FedWatch</div>

  <section class="mk" id="macro" aria-labelledby="mkTitle">
        <p class="mk-u" id="mkUpd">매일 한국 10:10 자동 저장 · 불러오는 중…</p>
    <div class="mk-c"><h3>😨 CNN 공포·탐욕 지수 (최근 100일)</h3><div id="mdFg" class="sub">--</div></div>
    <div class="mk-c"><h3>💱 원/달러 환율 (1년)</h3><div id="mdFx" class="sub">--</div></div>
    <div class="mk-c"><h3>🛒 미국 CPI · 전년비 상승률 (5년)</h3><div id="mdCpi" class="sub">--</div></div>
    <div class="mk-c"><h3>🏦 미국 10년물 국채금리 (1년)</h3><div id="mdUst" class="sub">--</div></div>
    <div class="mk-c"><h3>🎯 FedWatch · 다음 FOMC 금리 확률</h3>
      <div class="sub">무료 공개 API가 없어 CME 사이트에서 보고 직접 기록합니다 (이 기기에 저장).</div>
      <a class="mk-b" href="https://www.cmegroup.com/markets/interest-rates/cme-fedwatch-tool.html" target="_blank" rel="noopener">CME FedWatch 열기 ↗</a>
      <div class="mk-f"><input type="date" id="fedMd" aria-label="FOMC 회의일" style="grid-column:1/-1"><input type="number" id="fedHk" step="0.1" inputmode="decimal" placeholder="인상 %"><input type="number" id="fedHd" step="0.1" inputmode="decimal" placeholder="동결 %"><input type="number" id="fedCt" step="0.1" inputmode="decimal" placeholder="인하 %"></div>
      <button class="mk-b" id="fedAdd" type="button">＋ 오늘 기록</button> <button class="mk-b" id="fedDel" type="button">마지막 기록 삭제</button>
      <div id="mdFed" class="sub" style="margin-top:8px;"></div>
    </div>
  </section>
</div>
<script>
const APP_VERSION = "V1.01", RELEASE_DATE = "261019";
/* 📈 시장 지표: data/macro.json (GitHub Actions 매일 10:10 저장) */
(function () {
  const $ = id => document.getElementById(id) || { style: {}, set textContent(v) {}, set innerHTML(v) {} }, n2 = (v, d = 2) => (+v).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
  const FG = { "extreme fear": ["극도의 공포", "#F0475A"], fear: ["공포", "#F5A524"], neutral: ["중립", "#8E9AB0"], greed: ["탐욕", "#38D98C"], "extreme greed": ["극도의 탐욕", "#1FA971"] };
  const fgOf = v => v < 25 ? FG["extreme fear"] : v < 45 ? FG.fear : v < 55 ? FG.neutral : v < 75 ? FG.greed : FG["extreme greed"];
  function line(ser, col, ref) {
    if (!ser || ser.length < 2) return "";
    const W = 320, H = 110, pl = 4, pr = 40, pt = 8, pb = 16, ys = ser.map(p => p[1]).concat(ref != null ? [ref] : []);
    const lo = Math.min(...ys), hi = Math.max(...ys), sp = hi - lo || 1, X = i => pl + i * (W - pl - pr) / (ser.length - 1), Y = v => pt + (hi - v) / sp * (H - pt - pb);
    const pts = ser.map((p, i) => X(i).toFixed(1) + "," + Y(p[1]).toFixed(1)).join(" "), last = ser[ser.length - 1];
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="추이 차트">${ref != null ? `<line x1="${pl}" x2="${W - pr}" y1="${Y(ref)}" y2="${Y(ref)}" stroke="#5F6B82" stroke-dasharray="3 3"/>` : ""}
      <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/><circle cx="${X(ser.length - 1)}" cy="${Y(last[1])}" r="3.5" fill="${col}"/>
      <text x="${W - pr + 4}" y="${pt + 8}" font-size="10" fill="#8E9AB0">${n2(hi, hi < 100 ? 2 : 0)}</text><text x="${W - pr + 4}" y="${H - pb}" font-size="10" fill="#8E9AB0">${n2(lo, lo < 100 ? 2 : 0)}</text>
      <text x="${pl}" y="${H - 3}" font-size="10" fill="#5F6B82">${ser[0][0]}</text><text x="${W - pr}" y="${H - 3}" font-size="10" fill="#5F6B82" text-anchor="end">${last[0]}</text></svg>`;
  }
  const chg = (ser, k) => ser && ser.length > k ? ser[ser.length - 1][1] - ser[ser.length - 1 - k][1] : null;
  const sg = (v, d = 2) => v == null ? "" : (v >= 0 ? "+" : "") + n2(v, d);
  fetch("data/macro.json?h=" + new Date().toISOString().slice(0, 13), { cache: "no-cache" }).then(r => r.ok ? r.json() : null).then(m => {
    if (!m) { $("mkUpd").textContent = "아직 저장된 지표가 없습니다 (매일 10:10 자동 저장)"; return; }
    $("mkUpd").textContent = `매일 한국 10:10 자동 저장 · 마지막 ${m.updated_kst || "-"}`;
    if (m.fg) { const [t, c] = fgOf(m.fg.last); $("mkFg").textContent = Math.round(m.fg.last); $("mkFg").style.color = c; $("mkFgS").textContent = t;
      $("mdFg").innerHTML = `<span class="big" style="color:${c}">${n2(m.fg.last, 1)}</span> <b style="color:${c}">${t}</b> · ${m.fg.date} · 1주 전 ${n2(m.fg.prev_week, 1)}<br>0~25 극도의 공포 · 25~45 공포 · 45~55 중립 · 55~75 탐욕 · 75~100 극도의 탐욕${line(m.fg.series, c, 50)}`; }
    if (m.fx) { const d = chg(m.fx.series, 1); $("mkFx").textContent = n2(m.fx.last, 1); $("mkFxS").textContent = d == null ? m.fx.date : `${sg(d, 1)}원`;
      $("mdFx").innerHTML = `<span class="big">${n2(m.fx.last, 2)}원</span> · ${m.fx.date} · 전일 대비 ${sg(d, 2)} · 1개월 ${sg(chg(m.fx.series, 21), 1)}${line(m.fx.series, "#5EEAD4")}`; }
    if (m.cpi) { const s = m.cpi.series, bd = Object.fromEntries(s.map(p => [p[0].slice(0, 7), p[1]])), yo = s.map(p => { const q = bd[(+p[0].slice(0, 4) - 1) + p[0].slice(4, 7)]; return q ? [p[0].slice(0, 7), +((p[1] / q - 1) * 100).toFixed(2)] : null; }).filter(Boolean), c = m.cpi.yoy > 3 ? "#F0475A" : m.cpi.yoy > 2.5 ? "#F5A524" : "#38D98C";
      $("mkCpi").textContent = n2(m.cpi.yoy, 1) + "%"; $("mkCpi").style.color = c; $("mkCpiS").textContent = "전년비 · " + m.cpi.date.slice(5, 7) + "월";
      $("mdCpi").innerHTML = `<span class="big" style="color:${c}">${n2(m.cpi.yoy, 2)}%</span> 전년비 · ${m.cpi.date.slice(0, 7)} 발표분 · 지수 ${n2(m.cpi.last, 1)} · 점선 = Fed 목표 2%${line(yo, c, 2)}`; }
    if (m.ust) { const d = chg(m.ust.series, 1); $("mkUst").textContent = n2(m.ust.last, 2) + "%"; $("mkUstS").textContent = d == null ? m.ust.date : `${sg(d * 100, 0)}bp`;
      $("mdUst").innerHTML = `<span class="big">${n2(m.ust.last, 2)}%</span> · ${m.ust.date} · 전일 대비 ${sg(d * 100, 0)}bp · 1개월 ${sg((chg(m.ust.series, 21) || 0) * 100, 0)}bp${line(m.ust.series, "#A78BFA")}`; }
  }).catch(() => { $("mkUpd").textContent = "지표를 불러오지 못했습니다 — 잠시 뒤 새로고침"; });
  /* FedWatch 수동 기록 (예전 QLD 앱 기록 그대로 · 같은 저장 키) */
  const FK = "qld_fed_log_v1", get = () => { try { const a = JSON.parse(localStorage.getItem(FK) || "[]"); return Array.isArray(a) ? a : []; } catch (e) { return []; } };
  function fed() {
    const a = get(); if (!a.length) { $("mdFed").textContent = "기록을 저장하면 인상 확률 추이가 표시됩니다."; return; }
    const L = a[a.length - 1], c = L.hike >= 60 ? "#F0475A" : L.hike >= 30 ? "#F5A524" : "#38D98C";
    $("mdFed").innerHTML = `회의 ${L.meetingDate} · <b style="color:${c}">인상 ${L.hike}%</b> · 동결 ${L.hold ?? "--"}% · 인하 ${L.cut ?? "--"}% <span style="color:#5F6B82">(${new Date(L.recordedAt).toLocaleDateString("ko-KR")} 기록 · 총 ${a.length}건)</span>${line(a.map(r => [new Date(r.recordedAt).toISOString().slice(5, 10), r.hike]), c)}`;
  }
  $("fedAdd").addEventListener("click", () => {
    const md = $("fedMd").value, v = id => { const x = parseFloat($(id).value); return isNaN(x) ? null : x; }, hk = v("fedHk");
    if (!md || hk === null) { $("mdFed").textContent = "FOMC 회의일과 인상 확률을 입력하세요."; return; }
    const a = get(); a.push({ recordedAt: Date.now(), meetingDate: md, hike: hk, hold: v("fedHd"), cut: v("fedCt") });
    try { localStorage.setItem(FK, JSON.stringify(a)); } catch (e) {} ["fedHk", "fedHd", "fedCt"].forEach(id => $(id).value = ""); fed();
  });
  $("fedDel").addEventListener("click", () => { const a = get(); if (!a.length || !confirm("마지막 기록을 삭제할까요?")) return; a.pop(); try { localStorage.setItem(FK, JSON.stringify(a)); } catch (e) {} fed(); });
  fed();
})();
</script>
</body>
</html>
